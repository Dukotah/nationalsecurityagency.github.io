name: Refresh listing

# Regenerates _data/repos.json and code.json from the GitHub API and opens a
# pull request with the result. Runs only in forks: the upstream maintainers
# generate these files with their own internal tooling.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 1 * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    if: github.repository != 'NationalSecurityAgency/nationalsecurityagency.github.io'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Regenerate listing
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python3 scripts/regen_listing.py
        python3 scripts/audit_listing.py
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.3
        bundler-cache: true
    - name: Test site build
      run: bundle exec jekyll build
    - name: Open pull request
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        if git diff --quiet -- _data/repos.json _data/ignore.yml code.json; then
          echo "Listing already current."
          exit 0
        fi
        branch="refresh-listing/$(date -u +%Y-%m-%d)"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git checkout -b "$branch"
        git add _data/repos.json _data/ignore.yml code.json AUDIT.md
        git commit -m "Refresh project listing from the GitHub API"
        git push --force origin "$branch"
        gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" \
          --title "Refresh project listing ($(date -u +%Y-%m-%d))" \
          --body-file AUDIT.md || echo "A pull request for $branch already exists."
